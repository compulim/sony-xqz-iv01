name: Build xqz_probe

on:
  push:
    paths:
      - tools/xqz_probe/**
      - .github/workflows/xqz-probe.yml
  pull_request:
    paths:
      - tools/xqz_probe/**
      - .github/workflows/xqz-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check formatting
        run: dotnet format tools/xqz_probe/XqzProbe.csproj --verify-no-changes

      - name: Publish
        run: dotnet publish tools/xqz_probe/XqzProbe.csproj -c Release -r ${{ matrix.rid }} -o out/${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: xqz_probe-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/xqz_probe.exe
          if-no-files-found: error
